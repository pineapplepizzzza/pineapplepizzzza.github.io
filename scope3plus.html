<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCOPE 3+ Framework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@4.2.1/index.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', 'Segoe UI', Arial, sans-serif; background: #ffffff; color: #222; min-height: 100vh; }

    /* ─── LANDING ─── */
    #landing {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 48px 20px 52px; background: #ffffff;
    }
    .main-title {
      font-family: 'Nanum Brush Script', cursive;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      color: #111; margin-bottom: 36px; text-align: center; letter-spacing: 0.01em;
    }

    /* Board */
    .board {
      background: #0d1117;
      clip-path: polygon(0% 7%, 50% 0%, 100% 7%, 100% 100%, 0% 100%);
      padding: 52px 44px 44px;
      width: min(540px, 92vw);
      position: relative;
    }
    .bolt {
      position: absolute; width: 13px; height: 13px; border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #999, #444);
      box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .bolt-tl { top: 36px; left: 18px; }
    .bolt-tr { top: 36px; right: 18px; }
    .bolt-bl { bottom: 18px; left: 18px; }
    .bolt-br { bottom: 18px; right: 18px; }

    .board-header { text-align: center; margin-bottom: 20px; }
    .board-level {
      font-family: 'Cascadia Code', 'Courier New', monospace; font-size: 1.1rem; font-weight: 700;
      color: #ffffff; letter-spacing: 0.28em; margin-bottom: 10px;
    }
    .board-divider { width: 100%; height: 1px; background: rgba(255,255,255,0.18); }

    /* Folders */
    .folders-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 28px 32px; margin-top: 26px; justify-items: center;
    }
    .folder-wrapper {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      cursor: pointer; transition: transform 0.18s;
    }
    .folder-wrapper:hover { transform: scale(1.06); }
    .folder-wrapper:hover .folder-body { filter: brightness(1.13); }

    .folder-container { position: relative; width: 116px; height: 98px; }

    .folder-tab {
      position: absolute; top: 0; left: 0; width: 52px; height: 20px;
      background: linear-gradient(to bottom, #c4c8d0 0%, #aeb2ba 100%);
      border-radius: 7px 7px 0 0; z-index: 1;
    }
    .folder-body {
      position: absolute; top: 13px; left: 0; width: 116px; height: 85px;
      background: linear-gradient(155deg, #d0d4dc 0%, #bec2ca 28%, #aaaeb6 68%, #9a9ea6 100%);
      border-radius: 3px 9px 9px 9px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), inset 0 -2px 5px rgba(0,0,0,0.18), 0 5px 14px rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      transition: filter 0.18s;
    }
    .folder-number {
      font-family: 'Pretendard', 'Segoe UI', sans-serif; font-size: 2.9rem; font-weight: 700;
      color: rgba(70, 74, 82, 0.65); line-height: 1; margin-top: 10px;
    }
    .folder-badge {
      position: absolute; top: 3px; left: 3px; width: 25px; height: 25px;
      background: #e53935; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cascadia Code', 'Courier New', monospace; font-size: 0.68rem; font-weight: 700;
      color: #fff; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.35);
    }
    .folder-label {
      font-family: 'Cascadia Code', 'Courier New', monospace; font-size: 0.75rem;
      color: #ffffff; letter-spacing: 0.08em;
    }

    /* Footer */
    .footer-credit {
      font-family: 'Cascadia Code', 'Courier New', monospace; font-size: 0.82rem;
      color: #444; margin-top: 32px; letter-spacing: 0.14em;
    }

    /* ─── SCOPE DESKTOP VIEW ─── */
    #scope-view {
      display: none; position: relative; width: 100%; height: 100vh; overflow: hidden;
      background-color: #f2f2f2;
      background-image:
        linear-gradient(rgba(0,0,0,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.055) 1px, transparent 1px);
      background-size: 90px 90px;
    }
    #scope-view.open { display: block; }
    #scope-content { position: absolute; inset: 0; }

    /* Back button */
    .sv-back {
      position: fixed; top: 18px; left: 18px; z-index: 50;
      font-family: 'Cascadia Code', 'Courier New', monospace;
      font-size: 0.76rem; font-weight: 700;
      background: #0d1117; color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; cursor: pointer; letter-spacing: 0.05em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); transition: background 0.15s;
    }
    .sv-back:hover { background: #1c2a3a; }

    /* Central folder */
    .sv-folder {
      position: absolute; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 7px;
    }
    .sv-folder-con { position: relative; width: 116px; height: 98px; }
    .sv-folder-tab {
      position: absolute; top: 0; left: 0; width: 52px; height: 20px;
      background: linear-gradient(to bottom, #c4c8d0, #aeb2ba);
      border-radius: 7px 7px 0 0;
    }
    .sv-folder-body {
      position: absolute; top: 13px; left: 0; width: 116px; height: 85px;
      background: linear-gradient(155deg, #d0d4dc 0%, #bec2ca 28%, #aaaeb6 68%, #9a9ea6 100%);
      border-radius: 3px 9px 9px 9px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), inset 0 -2px 5px rgba(0,0,0,0.18), 0 5px 14px rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .sv-folder-num {
      font-family: 'Pretendard', sans-serif; font-size: 2.9rem; font-weight: 700;
      color: rgba(70,74,82,0.65); line-height: 1; margin-top: 10px;
    }
    .sv-folder-badge {
      position: absolute; top: 3px; left: 3px; width: 25px; height: 25px;
      background: #e53935; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cascadia Code', monospace; font-size: 0.68rem; font-weight: 700;
      color: #fff; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.35);
    }
    .sv-folder-lbl {
      font-family: 'Cascadia Code', 'Courier New', monospace; font-size: 0.76rem;
      background: #bad1e1; color: #111;
      padding: 3px 10px;
      border: 1.5px solid #111;
      letter-spacing: 0.06em;
    }

    /* Document icons */
    .sv-doc {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; transition: transform 0.18s;
    }
    .sv-doc:hover { transform: translate(-50%, -56%) scale(1.08); }

    /* Outer wrapper carries the drop-shadow (clip-path cancels box-shadow) */
    .sv-doc-outer {
      position: relative; width: 84px; height: 108px;
      filter:
        drop-shadow(2px 5px 10px rgba(0,0,0,0.22))
        drop-shadow(0 1px 2px rgba(0,0,0,0.10));
    }

    /* Paper body — clipped corner */
    .sv-doc-paper {
      width: 84px; height: 108px;
      background: linear-gradient(175deg, #f6f6f6 0%, #ffffff 40%);
      clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
      position: relative;
    }

    /* Fold triangle (top-right) */
    /* 접힌 모서리 삼각형 — clip-path로 정확한 방향 */
    .sv-doc-corner {
      position: absolute; top: 0; right: 0;
      width: 26px; height: 26px;
      background: linear-gradient(225deg, #b8b8b8 0%, #d2d2d2 100%);
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%);
    }
    .sv-doc-corner::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,0,0,0.2) 0%, transparent 55%);
    }

    .sv-doc-emoji {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -38%); font-size: 2.5rem; line-height: 1;
      filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.28));
    }
    .sv-doc-lbl {
      font-family: 'Pretendard', sans-serif; font-size: 0.7rem; font-weight: 500;
      color: #222; text-align: center; max-width: 90px; line-height: 1.3;
    }

    /* keep scope badge colors for modal tags */
    .s1{background:#4b3a8c} .s2{background:#3a6b3a} .s3{background:#2e5c7a} .s3p{background:#8c3a3a}

    /* ── MODAL ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; max-width: 580px; width: 100%; position: relative; animation: popIn 0.2s ease; display: flex; flex-direction: column; max-height: 88vh; }
    @keyframes popIn { from{transform:scale(0.92);opacity:0} to{transform:scale(1);opacity:1} }

    /* 모달 헤더 */
    .modal-header { padding: 22px 24px 16px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .modal-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #bbb; }
    .modal-close:hover { color: #333; }
    .modal-tag { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; color: #fff; }
    .t1{background:#4b3a8c} .t2{background:#3a6b3a} .t3{background:#2e5c7a} .t3p{background:#8c3a3a}
    .modal-title-row { display: flex; align-items: center; gap: 10px; }
    .modal-icon { font-size: 2rem; }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: #1a2b45; }

    /* 스텝 인디케이터 */
    .step-bar { display: flex; padding: 14px 24px 0; gap: 0; flex-shrink: 0; overflow-x: auto; }
    .step-item { flex: 1; text-align: center; padding: 8px 4px; font-size: 0.7rem; font-weight: 600; color: #bbb; border-bottom: 3px solid #eee; cursor: pointer; white-space: nowrap; transition: all 0.15s; min-width: 60px; }
    .step-item.active { color: #1a2b45; border-bottom-color: #1a2b45; }
    .step-item.done { color: #888; border-bottom-color: #ccc; }

    /* 스텝 콘텐츠 */
    .step-content { padding: 20px 24px; overflow-y: auto; flex: 1; min-height: 200px; }
    .step-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #999; margin-bottom: 10px; }
    .step-body { font-size: 0.87rem; line-height: 1.75; color: #444; }

    /* 네비게이션 */
    .modal-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-top: 1px solid #f0f0f0; flex-shrink: 0; }
    .nav-btn { display: flex; align-items: center; gap: 6px; background: none; border: 1.5px solid #ddd; border-radius: 8px; padding: 7px 16px; font-size: 0.82rem; font-weight: 600; color: #555; cursor: pointer; transition: all 0.15s; }
    .nav-btn:hover:not(:disabled) { border-color: #1a2b45; color: #1a2b45; background: #f0f4ff; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-btn.next { background: #1a2b45; border-color: #1a2b45; color: #fff; }
    .nav-btn.next:hover:not(:disabled) { background: #2e4a6e; }
    .step-counter { font-size: 0.78rem; color: #aaa; }

    /* 콘텐츠 스타일 */
    .formula { background: #f0f4ff; border-left: 4px solid #2e5c7a; border-radius: 6px; padding: 10px 14px; font-family: 'Courier New', monospace; font-size: 0.8rem; color: #1a3a5c; margin: 8px 0; line-height: 1.7; }
    .formula.red { background: #fff0f0; border-color: #8c3a3a; color: #5a1a1a; }
    .warn { background: #fff8e1; border-left: 4px solid #f0a500; border-radius: 6px; padding: 8px 12px; font-size: 0.82rem; color: #7a5a00; margin: 8px 0; line-height: 1.5; }
    table.tbl { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.8rem; }
    table.tbl th { background: #f0f4ff; color: #1a2b45; font-weight: 700; padding: 6px 8px; border: 1px solid #dde; text-align: left; }
    table.tbl td { padding: 5px 8px; border: 1px solid #eee; color: #444; vertical-align: top; }
    table.tbl tr:nth-child(even) td { background: #fafbff; }
    ul.dl { list-style: none; padding: 0; }
    ul.dl li { font-size: 0.85rem; color: #555; padding: 4px 0 4px 16px; position: relative; line-height: 1.5; }
    ul.dl li::before { content: '•'; position: absolute; left: 0; color: #bbb; }
    .ghg-card { background: #f8faff; border: 1px solid #dde8f5; border-radius: 8px; padding: 12px 14px; margin: 6px 0; }
    .ghg-card .label { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .ghg-card .value { font-size: 1.0rem; font-weight: 700; color: #1a2b45; font-family: 'Courier New', monospace; }
    .ghg-card.red { background: #fff5f5; border-color: #f5c8c8; }
    .ghg-card.red .value { color: #8c3a3a; }
  </style>
</head>
<body>

<!-- ═══ LANDING ═══ -->
<div id="landing">
  <h1 class="main-title">SCOPE 3+ Framework</h1>

  <div class="board">
    <div class="bolt bolt-tl"></div>
    <div class="bolt bolt-tr"></div>
    <div class="bolt bolt-bl"></div>
    <div class="bolt bolt-br"></div>

    <div class="board-header">
      <div class="board-level">LEVEL</div>
      <div class="board-divider"></div>
    </div>

    <div class="folders-grid">
      <!-- SCOPE 1 -->
      <div class="folder-wrapper" onclick="openScope('s1')">
        <div class="folder-container">
          <div class="folder-badge">6</div>
          <div class="folder-tab"></div>
          <div class="folder-body"><span class="folder-number">1</span></div>
        </div>
        <div class="folder-label">SCOPE_1</div>
      </div>
      <!-- SCOPE 2 -->
      <div class="folder-wrapper" onclick="openScope('s2')">
        <div class="folder-container">
          <div class="folder-badge">1</div>
          <div class="folder-tab"></div>
          <div class="folder-body"><span class="folder-number">2</span></div>
        </div>
        <div class="folder-label">SCOPE_2</div>
      </div>
      <!-- SCOPE 3 -->
      <div class="folder-wrapper" onclick="openScope('s3')">
        <div class="folder-container">
          <div class="folder-badge">4</div>
          <div class="folder-tab"></div>
          <div class="folder-body"><span class="folder-number">3</span></div>
        </div>
        <div class="folder-label">SCOPE_3</div>
      </div>
      <!-- SCOPE 3+ -->
      <div class="folder-wrapper" onclick="openScope('s3p')">
        <div class="folder-container">
          <div class="folder-badge">7</div>
          <div class="folder-tab"></div>
          <div class="folder-body"><span class="folder-number">3+</span></div>
        </div>
        <div class="folder-label">SCOPE_3+</div>
      </div>
    </div>
  </div>

  <div class="footer-credit">CAPSTONE DESIGN_TEAM 9.</div>
</div>

<!-- ═══ SCOPE DESKTOP ═══ -->
<div id="scope-view">
  <div id="scope-content"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeOnBg(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="close_()">✕</button>
    <div class="modal-header">
      <span class="modal-tag" id="m-tag"></span>
      <div class="modal-title-row">
        <span class="modal-icon" id="m-icon"></span>
        <span class="modal-title" id="m-title"></span>
      </div>
    </div>
    <div class="step-bar" id="step-bar"></div>
    <div class="step-content" id="step-content"></div>
    <div class="modal-nav">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← 이전</button>
      <span class="step-counter" id="step-counter"></span>
      <button class="nav-btn next" id="btn-next" onclick="navigate(1)">다음 →</button>
    </div>
  </div>
</div>

<script>
const STEPS = ['정의', '분류 및 경계 설정', '배출량 계산', '데이터 수집 방법'];

const D = {
  'mil-install': {
    tag:'SCOPE 1', tc:'t1', icon:'🏭', title:'군사 시설 (Military Installations)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">군사 시설 배출은 군이 운영하는 모든 고정 및 이동식 거점에서 화석연료를 직접 연소할 때 발생하는 직접배출로 정의된다. 기지 내 에너지 자립을 위한 가장 기초적인 배출원으로, 영구 기지, 임시 기지, 연소 설비, 연료를 포함한다.</div>`,
      `<div class="step-title">분류 및 경계 설정</div>
      <table class="tbl"><tr><th>구분</th><th>포함 범위</th></tr>
      <tr><td>영구 기지</td><td>후방 본토 기지, 해외 주둔 기지, 훈련 시설</td></tr>
      <tr><td>임시 기지</td><td>FOB(전방작전기지), 야전 캠프, 이동식 지휘소</td></tr>
      <tr><td>연소 설비</td><td>보일러(난방·취사), 비상 발전기, 소각로</td></tr>
      <tr><td>연료 종류</td><td>JP-8(항공유 겸용 지상 연료), 경유, 천연가스, LPG</td></tr></table>
      <div class="warn">경계: 시설의 지리적 위치가 아닌, 군의 실질적인 운영 통제 여부 기준<br>상업 전력망 구매 전력 → Scope 2 분리 / 기지 내 직접 발전기 연소 → Scope 1 포함</div>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula">E_시설 = Σ_f (FC_f × EF_f)

FC_f : 연료 종류 f의 소비량 (TJ 또는 L)
EF_f : 연료 f의 배출계수 (tCO₂eq / TJ)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>군 군수사령부 유류 보급 대장 및 기지별 에너지 사용 내역서</li>
        <li>IPCC 카테고리 1.A.5 (기타 연소/비지정 국가 국방 및 군사 활동): 군사 기지 고정 설비 난방·전술 발전·군용 자산 유류 소비 통합 추적 가이드라인</li>
        <li>NATO 온실가스 배출 매핑 방법론: GHG 프로토콜 규격을 군사 자산 및 주둔지 경계에 최적화한 기준</li>
      </ul>`
    ]
  },

  'aviation': {
    tag:'SCOPE 1', tc:'t1', icon:'✈️', title:'항공 전력 (Aviation)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">항공 전력 배출은 군용 항공기 및 항공기반 플랫폼이 제트 엔진 및 터보프롭 엔진에서 항공유(JP-8, Jet-A)를 연소할 때 발생하는 직접배출로 정의된다. 전투 출격, 정찰, 공중 수송, 공중 급유, 무인항공기 운용 등 전 항공 활동이 포함된다. 고고도 연소 특성상 배출 물질의 기후 강제력이 지표면 대비 2~4배 높다.</div>
      <table class="tbl"><tr><th>배출 물질</th><th>발생 메커니즘</th><th>기후·환경 영향</th><th>비고</th></tr>
      <tr><td>CO₂</td><td>완전 연소</td><td>장기 온난화</td><td>주 지표</td></tr>

  'ground': {
    tag:'SCOPE 1', tc:'t1', icon:'🛡️', title:'지상 전력 (Ground Forces)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">지상 전력 배출은 디젤 엔진 또는 군용 액체연료를 사용하는 기갑·차량화 부대의 기동 과정에서 연료를 직접 연소할 때 발생하는 직접배출로 정의된다. 전차, 장갑차, 군수트럭, 중장비, 공병 장비 등이 포함된다. 연비가 낮고 공회전 시간에 배출이 크게 좌우되는 특성이 있다.</div>

      `<div class="step-title">분류 및 경계 설정</div>

NCV   : 연료의 순 발열량 (TJ/kt)
EF_i  : 온실가스 i에 대한 배출계수 (t/TJ)
GWP_i : 온실가스 i에 대한 지구온난화지수

IPCC 이산화탄소 배출계수와 순발열량 기준

    ]

  'naval': {

  },

      제외 이유 ①: 전시 폭격 및 UAV 공격으로 민간 전력 인프라 파괴·불안정 → 대부분 군사 기지가 비상 전술 발전기 가동(Scope 1)으로 전환되어 상업 전력 소비(Scope 2) 중단<br>
      제외 이유 ②: 교전국의 국가 전력망 총 공급량, 전력 발전원 구성비, 군사 시설별 전력 매입 내역서 등이 군사 기밀로 엄격히 분류되어 외부 접근 차단</div>`,

η_loss      : 해당 작전 지역 국가 전력망 고유의 송전 손실률 (0.05~0.10)
EF_grid     : 국가별 전력 그리드의 평균 탄소 배출계수 (kgCO₂eq/kWh)</div>`,
      `<div class="step-title">데이터 수집 방법 (참고용)</div>
      <ul class="dl">
        <li>IEA 국가별 전력망 배출계수</li>
        <li>국가별 전력 공급량 및 발전원 구성비 통계</li>
      </ul>
      <div class="warn">⚠️ 전시 데이터 확보 불가 — 계산에서 제외</div>`

  'goods-mfg': {

  'logistics': {

  'waste': {
    tag:'SCOPE 3', tc:'t3', icon:'♻️', title:'폐기물 관리 (Waste Management)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">폐기물 관리 배출은 전장 및 작전 기지 내에서 발생하는 각종 군사·생활 폐기물의 처리, 소각, 매립 및 장비 파괴 과정에서 발생하는 배출로 정의된다. 특히 야전 환경에서는 구덩이를 파고 open-burning 방식으로 태우는 야전 소각 처리가 흔히 사용되며, 이는 통제된 현대식 소각로 대비 온실가스 및 독성 물질을 다량 방출한다.</div>
      <table class="tbl"><tr><th>폐기물 유형</th><th>처리 방법</th><th>배출 특성</th></tr>
      <tr><td>일반 생활 폐기물</td><td>Burn Pit 소각</td><td>CO₂, Dioxin, Furan</td></tr>
      <tr><td>손상 차량·장비</td><td>현장 해체, 야외 방치</td><td>냉매 누출(HFCs), 오일 누출</td></tr>
      <tr><td>의료 폐기물</td><td>고온 소각</td><td>N₂O, CO</td></tr>
      <tr><td>탄약 불발탄</td><td>통제 폭파 (EOD)</td><td>폭발 배출</td></tr>
      <tr><td>연료 오염 토양</td><td>매립 또는 방치</td><td>CH₄ (토양 내 분해 과정)</td></tr></table>`,
      `<div class="step-title">분류 및 경계 설정</div>
      <div class="step-body">야전 분쟁 지역의 특성상 통제된 현대식 폐기물 처리 인프라는 존재하지 않는 것으로 가정하므로, 배출량 산정 메커니즘은 야전 소각과 손상 차량·장비의 냉매 누출 두 가지로 제한한다.</div>
      <table class="tbl"><tr><th>폐기물 유형</th><th>현장 처리</th><th>탄소 배출계수</th><th>독성 보정계수</th></tr>
      <tr><td>일반 생활 폐기물</td><td>야전 소각</td><td>915 kgCO₂eq/t</td><td>0.15 (15% 가중)</td></tr>
      <tr><td>의료 폐기물</td><td>고온 소각 (야전 연소)</td><td>1,250 kgCO₂eq/t</td><td>0.20 (20% 가중)</td></tr>
      <tr><td>탄약 불발탄</td><td>통제 폭파 (EOD)</td><td>1,800 kgCO₂eq/t</td><td>-</td></tr>
      <tr><td>연료 오염 토양</td><td>매립 또는 야외 방치</td><td>450 kgCO₂eq/t</td><td>-</td></tr></table>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula">① 야전 소각 배출량
E_야전소각 = W_mixed × EF_burnpit × (1 + φ_toxic)

W_mixed   : 야전 소각 구덩이 투입 혼합 폐기물 총량 (t)
EF_burnpit: 오픈 필드 혼합 소각 기준 배출계수 (kgCO₂eq/t)
φ_toxic   : 독성 물질 보정계수 (0.15~0.25)

② 손상 차량 및 장비 냉매 누출
E_냉매누출 = N_vehicle × Q_refrigerant × GWP_HFC

N_vehicle    : 파괴 및 손실이 확인된 전술 차량 및 기갑 장비 총수 (대)
Q_refrigerant: 차종별 시스템 내부 표준 냉매 충전량 (kg/대)
GWP_HFC      : 누출된 냉매 물질 고유의 지구온난화지수 (kgCO₂eq/kg-냉매)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>U.S. GAO (미 정부책임처) 분쟁지역 보고서: 이라크·아프가니스탄 주둔 미군 데이터 기반 1인당 일일 폐기물 발생량 지표 확보 및 대형 기지(Joint Base Balad) 1일 소각량(147~250톤) 통계 매핑</li>
        <li>National Academies 보고서: 대규모 군사 작전 시 야전 소각 운용에 따른 장기 환경·보건 영향성 평가 데이터 및 폐기물 성상별 소각 프로파일</li>
        <li>Oryx OSINT 손실 데이터베이스: 사진 및 영상으로 파괴가 검증된 전술 차량 수 확보하여 차종별 표준 냉매 누출 총량 계산에 연계</li>
        <li>Sentinel-5P 대기 관측 위성: 대기 중 메탄 및 오염물질 농도 탐지를 통해 군사 기지 주변의 야전 소각 가동 여부를 원격 식별 및 검증</li>
      </ul>`
    ]
  },


  'fuel-lca': {
    tag:'SCOPE 3', tc:'t3', icon:'🔬', title:'연료·에너지 관련 활동 LCA',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">연료·에너지 관련 활동 LCA 배출은 앞선 Scope 1 및 Scope 2 범위에 포함되지 않는 연료 및 전력 생애주기(LCA) 상의 업스트림·다운스트림 배출과 물리적 유실량을 포착하는 범주로 정의된다. 군용 연료의 연소 전 단계(Well-to-Tank) 탄소 발자국과 상업 전력망 이용 시 발생하는 송전 및 배선 손실을 통합 산정한다.</div>`,
      `<div class="step-title">분류 및 경계 설정</div>
      <div class="step-body">군 외부의 에너지 공급망을 산정 경계로 설정하며, 타 범주와의 데이터 중복을 방지하기 위해 두 가지 범주로 분류한다.</div>
      <div class="formula">[연료 업스트림 배출]
원유 시추 → 가스 플레어링·누출(Fugitive CH₄) → 정유 공정 에너지 사용
→ 파이프라인/유조선 운송 → 군 연료 저장소 입고

[송전 및 배선 손실]
발전소 생산 전력 → 송전선 저항 손실 → 변전소 손실 → 군사 기지 수전
(일반적으로 전체 발전량의 5~10% 손실)

전시 폭격으로 민간 전력망 마비되는 분쟁 지역 특성을 고려하여
실제 정량 산정 시에는 유류 업스트림 중심으로 경계 제한 가능</div>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula">① 연료 업스트림 배출량 (Well-to-Tank)
E_WTT = FC_total × EF_WTT,f

FC_total   : 군 전반에서 소비한 연료 f의 총 소비량 (MJ 또는 t)
EF_WTT,f   : 연료 f 고유의 Well-to-Tank 탄소 배출계수 (gCO₂eq/MJ)

② 송전 및 배선 손실 배출량
E_loss = E_purchased × (η_loss / (1 - η_loss)) × EF_grid

E_purchased : 군사 기지 외부 상업 전력망 소비 총 전력량 (kWh)
η_loss      : 해당 작전 지역 국가 전력망 송전 손실률 (0.05~0.10)
EF_grid     : 국가별 전력 그리드 평균 탄소 배출계수 (kgCO₂eq/kWh)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>GREET 모델 (Argonne 국립연구소): 원유 채굴 단계부터 군 장비 주입 전까지의 Well-to-Tank 전과정 표준 배출계수 데이터 활용</li>
        <li>Ecoinvent LCA 데이터베이스: 글로벌 정유 공정의 에너지 소비 믹스, 수송 수단별(파이프라인, 유조선) 단위 거리당 탈루 배출 데이터 공급원</li>
      </ul>`
    ]
  },

  'destroyed-equip': {
    tag:'SCOPE 3+', tc:'t3p', icon:'🔧', title:'파괴된 군사 장비 (Destroyed Equipment)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">파괴된 장비 배출은 분쟁 중 조기에 파괴된 전차·전투기·차량 등의 잔여 내재 탄소(Stranded Embodied Carbon)를 일시 귀속하는 배출원으로 정의된다. 장비가 설계 수명을 충족하지 못하고 전장에서 손실됨으로써, 남은 수명만큼 제조 단계에서 투입되었던 탄소가 유효하게 사용되지 못하고 '낭비·손실'되었다는 개념을 기초로 한다.</div>`,
      `<div class="step-title">분류 및 경계 설정</div>
      <div class="step-body">평시 보유 자산의 운용 배출과 분쟁으로 인한 자산의 최종 손실 배출을 명확히 분리하는 것이 핵심이다.</div>
      <table class="tbl"><tr><th>손실 상태</th><th>귀속 방법</th></tr>
      <tr><td>정상 운용 장비</td><td>분쟁 배출량에서 제외</td></tr>
      <tr><td>파괴된 장비</td><td>잔여 내재 탄소 전액을 분쟁 배출량(Scope 3+)으로 귀속</td></tr>
      <tr><td>손상된 장비</td><td>수리·재사용 가능성에 따라 잔여 내재 탄소 부분 귀속 (기본 손상 계수 0.3 적용)</td></tr></table>
      <div class="warn">전시 새로운 장비 구매는 이미 타국 군대가 보유한 장비를 구매·수송하는 경우가 많다고 판단하여 이 프레임워크에서 제외</div>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula red">E_장비손실 = Σ_i (N_destroyed,i × EC_i × R_remaining,i)
             + Σ_j (N_civilian,j × EC_civilian,j)

N_destroyed,i : 군사 장비 i의 파괴 수량 (대)
EC_i          : 군사 장비 i의 대당 총 내재 탄소 (tCO₂eq/대)
              (장비 무게 1kg당 6kgCO₂ 지표적 탄소 발자국 적용)
R_remaining,i : 파괴된 장비의 잔여 수명 비율 (완전 파괴 시 1, 손상 시 0.3)
N_civilian,j  : 동원된 민간 장비(트럭, 농기구 등) j의 손실 수량 (대)
EC_civilian,j : 민간 LCA DB 기준 민간 장비 j의 대당 내재 탄소 (tCO₂eq/대)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>Oryx 데이터베이스: 위성·소셜미디어 등으로 전장에서 시각적으로 확인된 장비 손실을 실시간 집계하는 오픈소스 인텔리전스(OSINT) 프로젝트</li>
        <li>EcoZagroza: 우크라이나 환경보호자연자원부의 실시간 환경 위협 및 전시 환경 범죄 기록 플랫폼</li>
        <li>Ecoinvent 민간 장비 LCA 데이터: 트랙터·트럭 등 민간용 기계 및 장비 데이터를 군사 장비 대리 지표(proxy)로 활용</li>
      </ul>
      <div class="warn">⚠️ 군사 장비 제조 LCA 데이터 거의 없음 → 민간용 기계 데이터를 대리 지표로 활용</div>`
    ]
  },

  'wildfires': {
    tag:'SCOPE 3+', tc:'t3p', icon:'🔥', title:'산불·지표 화재 (Wildfires and Surface Fires)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">산불 및 지표 화재 배출은 분쟁 중 폭격, 소이탄, 포격 불씨 또는 방화로 인해 발생하는 비의도적 생태계 연소 배출원으로 정의된다. 바이오매스(산림, 초지, 이탄지 등)가 연소됨에 따라 수십 년간 축적되었던 탄소가 단시간에 다량 방출된다. 연소 시 발생하는 주요 온실가스 및 대기오염물질은 CO₂, CO, CH₄, N₂O, NOx, BC(Black Carbon) 등이며, 화재가 발생한 생태계 유형별로 각 물질의 배출 비율은 상이하게 적용된다.</div>`,
      `<div class="step-title">분류 및 경계 설정 (위성 탐지 5단계 프로세스)</div>
      <ul class="dl">
        <li><b>1단계: 화재 매핑</b> — MODIS, Sentinel-2, NASA FIRMS, Copernicus EFFIS 등의 위성 화재 탐지 시스템으로 분쟁 지역 내 열점(Hot Spot) 식별. Copernicus CEMS의 FWI(Fire Weather Index) 데이터를 대조하여 자연 발화 가능성 배제</li>
        <li><b>2단계: 화재 면적 산출</b> — 열점 위치 반경 1km 이내 Sentinel-2 영상을 분석하여 화재 외곽선 산출</li>
        <li><b>3단계: 완충지대 구획화</b> — Zone 1(전선 영향 없음) / Zone 2(이동하는 전선 양측 30km 완충지대 누적 영역) / Zone 3(2014년 이후 점령지 중 완충지대 외부)</li>
        <li><b>4단계: 바이오매스 손실 산정</b> — 산림·농경지·기타 자연 경관별 바이오매스 밀도 적용하여 배출량 계산</li>
        <li><b>5단계: 전쟁 기인도 평가</b> — Zone 2와 유사 환경의 Zone 1 배출량 차이를 계산하여 전쟁으로 인한 추가 배출량 확정</li>
      </ul>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula red">E_화재 = S × M_b × C_f × EF

S   : 화재 면적 (ha)
M_b : 단위 면적당 연소 가능한 바이오매스 (t/ha)
C_f : 연소 효율 (Combustion Factor, 생태계 유형별 0.2~0.9)
EF  : 물질별 온실가스 배출계수 (kg/t)

배출 물질: CO₂, CO, CH₄, N₂O, NOx, BC(Black Carbon)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>MODIS, Sentinel-2, NASA FIRMS, Copernicus EFFIS: 위성 화재 탐지 시스템 — 분쟁 지역 내 열점 식별</li>
        <li>Zoï Environment Network: 일일 전선 데이터 — 완충지대 구획화를 위한 전선 위치 정보</li>
        <li>우크라이나 농업식품정책부 데이터: 4대 우점 작물 구조, 작물별 수확량 통계 및 지상부·뿌리 잔류물 총 수확량 계수</li>
        <li>국가통계청 지리 정보 및 토지 디렉토리: 지역별 채초지, 휴경지, 목초지의 점유 비율 계산</li>
      </ul>`
    ]
  },

  'civilian-infra': {
    tag:'SCOPE 3+', tc:'t3p', icon:'🏚️', title:'사회 기반 시설 피해 — 민간 인프라',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">민간 인프라 피해 배출은 폭격 및 포격으로 인해 주거용 건물, 도로, 교량 등이 파괴되는 순간 발생하는 분진과 화재(연소) 배출원으로 정의된다. 폭격과 포격으로 건물이 파괴될 때 발생하는 배출 경로는 두 가지로 나뉘는데, 본 부문은 '파괴 순간의 분진 및 화재 배출'만을 의미하며, 건물이 보유하고 있던 내재 탄소의 조기 방출 경로와는 명확히 구별된다.</div>`,
      `<div class="step-title">분류 및 경계 설정</div>
      <div class="step-body">민간 인프라의 온실가스 배출량은 화재 시 배출 기여도가 높은 플라스틱 및 목재와 같은 고가연성 물질의 총량에 집중한다.</div>
      <table class="tbl"><tr><th>상태</th><th>연소 계수 (CF)</th></tr>
      <tr><td>부분 연소된 건물</td><td>0.5</td></tr>
      <tr><td>완전 연소된 건물</td><td>1.0</td></tr></table>
      <div class="warn">상세 재료 분율 데이터 부족 시 우크라이나 환경보호 및 천연자원부 방법론에 따라 가연성 물질 1톤당 2.64 tCO₂의 표준 계수를 적용한 간소화 식 사용 가능</div>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula red">E_민간인프라 = N_bld × M_mat × [Σ_m(EF_m × f_m) × CF]

N_bld  : 무력 충돌로 연소된 건물의 수 (대)
M_mat  : 건물당 가연성 물질의 평균 질량 (t)
EF_m   : 가연성 재료 m(플라스틱, 목재 등)의 고유 배출계수 (tCO₂e/t)
f_m    : 전체 가연성 물질 중 해당 재료 m의 비율
CF     : 화재 강도에 따른 연소 계수 (부분 연소 0.5, 완전 연소 1.0)

[간소화 식]
E_민간인프라 = N_bld × M_mat × 2.64
(가연성 물질 배출계수: 2.64 tCO₂/t, RC 구조 아파트 내재 탄소: 500~800 kgCO₂eq/m²)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>KSE (키이우 경제 대학) 피해 및 손실 평가 보고서: 파괴 및 파손 건물 수 정량 확보</li>
        <li>교차 검증: 손실 건물 면적 기준 RC 구조 아파트 원단위(500~800 kgCO₂eq/m²)를 매칭하여 가연성 물질 배출량과 비교 분석</li>
      </ul>`
    ]
  },

  'energy-infra': {
    tag:'SCOPE 3+', tc:'t3p', icon:'🏭', title:'사회 기반 시설 피해 — 에너지 인프라',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">에너지 인프라 피해 배출은 정유 시설, 유류 저장소, 발전소, 가스 관로 등의 시설이 폭격 당했을 때 저장되어 있던 연료와 가스가 통제되지 않은 상태로 연소 및 누출되면서 발생하는 배출원으로 정의된다. 이는 일반 시설 파괴보다 훨씬 많은 온실가스를 방출하며, 유정 화재의 경우 수개월간 연소가 지속될 수 있다 (1991년 쿠웨이트 사례).</div>`,
      `<div class="step-title">분류 및 경계 설정</div>
      <div class="step-body">피격된 시설의 유형별 세부 배출 경로와 실질적인 연소 대상을 기준으로 산정 경계를 확정한다.</div>
      <table class="tbl"><tr><th>시설 유형</th><th>배출 경로</th><th>연소 대상</th></tr>
      <tr><td>유류 저장소</td><td>탱크 내 연료 전량 화재 연소</td><td>휘발유, 디젤, 중유 등 액체 화석연료</td></tr>
      <tr><td>정유 시설</td><td>공정 내 탄화수소 누출·연소 및 촉매 파괴</td><td>미정제 원유, 공정 촉매제</td></tr>
      <tr><td>천연가스 파이프라인</td><td>메탄 직접 누출 및 가압장관로 파열 화재 (GWP 27.9)</td><td>고압 압축 천연가스 (CH₄)</td></tr>
      <tr><td>발전소</td><td>내부 연료 재고 연소 및 변압기 오일 누출</td><td>발전용 석탄·가스 재고, 변압기 절연유 및 절연 가스</td></tr></table>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula red">E_에너지인프라 = E_oil + E_gas + E_power

① 액체 연료 및 석유 인프라
E_oil = Σ_y (FC_y × NCV_y × CC_y × 44/12)
FC_y  : 연료 유형 y의 총 연소량 (t)
NCV_y : 연료 유형 y의 순발열량 (GJ/t)
CC_y  : 연료 유형 y의 탄소 함량 (tC/GJ)

② 천연가스 인프라
E_gas = (NG_combustion × NCV_NG × EF_NG × 44/12)
      + (NG_leakage × GWP_CH4)
CH₄ GWP: 27.9 / NG_leakage: 대기 중 직접 누출 천연가스량 (t)

③ 전력 인프라 (SF₆ 누출)
E_power = SF6_leak × GWP_SF6
SF₆ GWP: 23,500</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>KSE 피해 및 손실 평가 보고서: 에너지 인프라의 정량적 수량 확보</li>
        <li>Frontelligence Insight &amp; Geoconfirmd: 위성 사진 및 OSINT 기반의 공격 위치 및 파손 면적 검증</li>
        <li>국가 온실가스 인벤토리(NID): 분쟁 전 공식 관리되던 시설별 표준 저장 용량 및 설비 스펙 데이터</li>
      </ul>`
    ]
  },

  'reconstruction': {
    tag:'SCOPE 3+', tc:'t3p', icon:'🔨', title:'복구·재건 (Reconstruction)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">복구 및 재건 부문의 온실가스 배출량은 분쟁 기간 중 파괴된 민간 자산 및 사회 기반 시설을 전후에 복구·신조하는 과정에서 발생하는 미래의 잠재적 배출량을 현재 시점에서 추정하는 것으로 정의한다. 이는 현재의 파괴 행위가 미래의 대규모 탄소 지출을 강제한다는 점에서 전쟁 배출량의 '장기 꼬리(Long Tail)' 효과에 해당한다.</div>`,
      `<div class="step-title">분류 및 경계 설정</div>
      <div class="step-body">확보 가능한 피해 데이터의 형태와 자산의 물리적 복잡성에 따라 두 가지 경계로 분류한다.</div>
      <table class="tbl"><tr><th>산정 분류 경계</th><th>대상 자산 유형</th><th>산정 범위</th></tr>
      <tr><td>물리적 측정</td><td>건물, 도로, 차량</td><td>핵심 건설 자재 고유의 내재 탄소 범위 (간접 배출원 제외)</td></tr>
      <tr><td>거시 경제학 공급망</td><td>복합 유틸리티 (제조 공장, 정유 설비 등)</td><td>공급망 전과정의 파급 효과 전반을 통합 (레온티에프 역행렬)</td></tr></table>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula red">E_복구재건 = E_buildings + E_infrastructure + E_vehicles + E_ind_utilities

① 건물 재건
E_buildings = S_damaged × C_f × EF_GHG × 10⁻³
(EF_GHG 기본값: 500 kgCO₂e/m², C_f: 완전 파손=1, 부분=0.33)

② 도로 재건
E_infrastructure = L_damaged × C_f × EF_GHG
(EF_GHG: 우크라이나 표준 단선 2차로 711 tCO₂e/km, C_f 기본값 0.33)

③ 차량 재건
E_vehicles = Q_damaged × C_f × EF_GHG × 10⁻³
(C_f: 완전 파괴=1.0, 수리 가능=0.33; 승용차 5.6 / 버스 40.7 / 트램 125.4 / 소방차 89.6 tCO₂e/대)

④ 산업·유틸리티 복합 시설 (레온티에프 역행렬)
x = Ax + y_ind → E_ind = ê × L × y_ind</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>KSE (키이우 경제 대학) 피해 및 손실 평가 보고서: 기초 정량 데이터 (면적, 길이, 차량 수, 예산 가액)</li>
        <li>One Click LCA 데이터베이스: 건물의 수명 주기 평가 전문 프로그램</li>
        <li>국가 산업연관표 (Input-Output Table): 레온티에프 역행렬 및 부문별 탄소 집약도 도출을 위한 투입산출 통계 자료</li>

  },

  'displacement': {
    tag:'SCOPE 3+', tc:'t3p', icon:'🚶', title:'인구 이동·난민 (Population Displacement)',
    steps: [
      `<div class="step-title">정의</div>
      <div class="step-body">인구 이동 및 난민 발생 배출은 전쟁으로 인한 강제 이주(국외 피난민 및 국내 실향민) 과정에서 발생하는 피난 목적의 교통 배출량을 의미한다. 우크라이나 전쟁 초기에만 수백만 명이 유럽으로 이동했으며, 이러한 대규모 인구의 급격한 지리적 이동은 상당한 교통 배출을 유발했다.</div>`,
      `<div class="step-title">분류 및 경계 설정</div>

      <table class="tbl"><tr><th>수송 수단</th><th>배출계수 (kgCO₂eq/인·km)</th></tr>

      <tr><td>버스</td><td>0.06</td></tr>

      <div class="formula red">E_인구이동 = Σ_i Σ_m (P_i × D_i × MS_m × EF_m × 10⁻³)

P_i  : 이주 민간인 집단 i(국외 피난민, 국내 실향민 등)의 총 이동 인원수 (명)
D_i  : 집단 i의 인당 평균 이동 거리 (우크라이나 국내 실향민: 434 km)
MS_m : 수송 수단 m의 이용 분담률 (Σ MS_m = 1)
EF_m : 수송 수단 m의 승객-킬로미터당 온실가스 배출계수 (kgCO₂eq/인·km)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>유엔난민기구 (UNHCR): 국외 피난민 통계</li>
        <li>국제이주기구 (IOM)의 실향 추적 매트릭스 (DTM): 시간 경과에 따른 실향민과 귀환민의 수</li>
        <li>영국 에너지안보및넷제로부 (DESNZ): 수송 수단별 표준 온실가스 배출량</li>

      <div class="warn">⚠️ 공식 국제기구 조사 대상에서 제외되거나 특수 지역으로 이동한 인구 데이터는 데이터 불확실성을 주석에 명시한 후 공신력 있는 언론 보도 및 OSINT 추정치를 보수적으로 보완</div>`

  'aviation-reroute': {
    tag:'SCOPE 3+', tc:'t3p', icon:'🛫', title:'항공·해운 우회 (Aviation & Maritime Rerouting)',

      <table class="tbl"><tr><th>사례</th><th>우회 영향</th></tr>

      <tr><td>벨라루스 영공 폐쇄</td><td>북유럽-중앙아시아 노선 우회</td></tr>
      <tr><td>홍해 분쟁 (후티 공격)</td><td>수에즈 운하 기피 → 희망봉 우회, 항해 거리 약 6,000~9,000 km 증가</td></tr></table>`,
      `<div class="step-title">배출량 계산</div>
      <div class="formula red">① 항공 우회 추가 배출량
E_aviation = Σ_k [(D_bypass,k - D_original,k) × N_k × FC_k × EF_fuel] × 10⁻³

D_bypass,k  : 우회한 항공 노선 k의 편당 총 비행 거리 (km)
D_original,k: 분쟁 이전 기존 표준 항공 노선 k의 편당 총 비행 거리 (km)
N_k         : 산정 기간 내 해당 우회 노선 k를 운항한 총 항공 편수 (편)
FC_k        : 항공 기종의 단위 거리당 평균 연료 소비량 (kg/km)
EF_fuel     : 항공유 고유의 온실가스 배출계수 (kgCO₂e/kg-fuel)

② 해운 우회 추가 배출량
E_maritime = Σ_k [(D_bypass,k - D_original,k) × T_s × FC_s × EF_bunker] × 10⁻³

T_s         : 해당 우회 항로 s를 통과한 선박의 총 운항 항차 수 (회)
FC_s        : 선박 유형별·톤수별 단위 거리당 연료 소비율 (kg/km)
EF_bunker   : 선박 연료(선박용 중유 등) 온실가스 배출계수 (kgCO₂e/kg-fuel)</div>`,
      `<div class="step-title">데이터 수집 방법</div>
      <ul class="dl">
        <li>Flightradar24.com: 위성 기반 실시간 위치 추적 데이터로 늘어난 운행 시간 및 노선 파악</li>
        <li>국제민간항공기구 (ICAO) 탄소 계산기: 항공기의 기종별, 운항거리별 연료사용량 원단위 데이터 교차 검증 및 매칭</li>
        <li>국제해사기구 (IMO) 선박 배출 지침: 해운 상선의 선종별, 크기별, 항해 속도별 표준 해리당 연료 소비율 수집</li>
      </ul>`
    ]
  }
};

function openScope(scopeKey) {
  const sc = SCOPE_CARDS[scopeKey];
  const sp = SCOPE_POS[scopeKey];
  let html = `<button class="sv-back" onclick="backToLanding()">← BACK</button>`;
  html += `
    <div class="sv-folder" style="left:${sp.folder.left};top:${sp.folder.top}">
      <div class="sv-folder-con">
        <div class="sv-folder-badge">${sc.items.length}</div>
        <div class="sv-folder-tab"></div>
        <div class="sv-folder-body"><span class="sv-folder-num">${sp.folder.num}</span></div>
      </div>
      <div class="sv-folder-lbl">${sc.title}</div>
    </div>`;
  sc.items.forEach((item, idx) => {
    const pos = sp.items[idx];
    html += `
      <div class="sv-doc" style="left:${pos.left};top:${pos.top}" onclick="openModal('${item.id}')">
        <div class="sv-doc-outer">
          <div class="sv-doc-paper">
            <div class="sv-doc-corner"></div>
            <div class="sv-doc-emoji">${item.icon}</div>
          </div>
        </div>
        <div class="sv-doc-lbl">${item.label}</div>
      </div>`;
  });
  document.getElementById('scope-content').innerHTML = html;
  document.getElementById('landing').style.display = 'none';
  document.getElementById('scope-view').classList.add('open');
}

function backToLanding() {
  document.getElementById('scope-view').classList.remove('open');
  document.getElementById('scope-view').style.display = '';
  document.getElementById('landing').style.display = '';
}

let curKey = null, curStep = 0;

function openModal(key) {
  curKey = key; curStep = 0;
  const d = D[key];
  document.getElementById('m-tag').textContent = d.tag;
  document.getElementById('m-tag').className = 'modal-tag ' + d.tc;
  document.getElementById('m-icon').textContent = d.icon;
  document.getElementById('m-title').textContent = d.title;
  renderStep();
  document.getElementById('overlay').classList.add('open');
}

function renderStep() {
  const d = D[curKey];
  const bar = document.getElementById('step-bar');
  bar.innerHTML = STEPS.map((s, i) =>
    `<div class="step-item ${i === curStep ? 'active' : i < curStep ? 'done' : ''}" onclick="goStep(${i})">${s}</div>`
  ).join('');
  document.getElementById('step-content').innerHTML = d.steps[curStep];
  document.getElementById('step-counter').textContent = `${curStep + 1} / ${STEPS.length}`;
  document.getElementById('btn-prev').disabled = curStep === 0;
  document.getElementById('btn-next').disabled = curStep === STEPS.length - 1;
}

function goStep(i) { curStep = i; renderStep(); }
function navigate(dir) {
  curStep = Math.max(0, Math.min(STEPS.length - 1, curStep + dir));
  renderStep();
}
function close_() { document.getElementById('overlay').classList.remove('open'); }
function closeOnBg(e) { if (e.target === document.getElementById('overlay')) close_(); }
